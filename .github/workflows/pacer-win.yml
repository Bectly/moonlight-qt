name: Pacer test build (Windows x64)
permissions:
  contents: read
on:
  push:
    branches: [pacer-flush]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-2025
    env:
      CI_VERSION: 6.2.0-pacer
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: 'recursive'
          fetch-depth: 1
      - name: Download dependencies
        run: powershell ./setup-deps.ps1
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          cache: true
          set-env: false
          add-tools-to-path: false
          tools: 'tools_qtcreator_gui'
          version: 6.12.0
          aqtsource: 'git+https://github.com/miurahr/aqtinstall.git@073e34d7c2ab4ae6961ed7cca690b3abd5ba5a7e'
      - name: Build x64
        shell: cmd
        run: |
          set "PATH=%QT_PATH%;%PATH%"
          scripts\build-arch.bat Release x64
        env:
          QT_PATH: ${{ runner.workspace }}\Qt\6.12.0\msvc2022_64\bin
      - uses: actions/upload-artifact@v6
        with:
          name: Moonlight-pacer-x64
          path: build/deploy-x64-release/*
          if-no-files-found: error
